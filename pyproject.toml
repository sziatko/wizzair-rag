[project]
name = "wizzair-rag"
version = "0.1.0"
description = "Baggage Q&A assistant for Wizz Air with cited answers and evals"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.8.0",
    "numpy>=2.5.4",
    "pdfplumber>=0.11.10",
    "voyageai>=0.6.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
