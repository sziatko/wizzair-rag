<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baggage assistant demo</title>
<style>
  :root {
    --bg: #f6f5f9; --card: #fff; --text: #1d1b26; --muted: #6a6778; --line: #e4e1ec;
    --accent: #5a2d91; --accent-soft: #efe8f8; --ok: #1d7a46; --ok-soft: #e3f4ea; --warn: #8a5a00; --warn-soft: #fbf0d9; --err: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14121a; --card: #1e1b27; --text: #ece9f3; --muted: #a29fb2; --line: #33303f;
      --accent: #b99af0; --accent-soft: #2b2340; --ok: #6fd39a; --ok-soft: #173325; --warn: #e8bd6a; --warn-soft: #3a2f16; --err: #f2918a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; padding: 12px 14px; font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  input:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button { font: inherit; cursor: pointer; border-radius: 10px; }
  .ask { padding: 12px 20px; color: #fff; background: var(--accent); border: 0; font-weight: 600; }
  @media (prefers-color-scheme: dark) { .ask { color: #14121a; } }
  .ask:disabled { opacity: .6; cursor: wait; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 24px; }
  .chip { padding: 6px 12px; font-size: .875rem; color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 999px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  .badge { display: inline-block; padding: 2px 10px; font-size: .8125rem; font-weight: 600; border-radius: 999px; margin-bottom: 10px; }
  .badge.answer { color: var(--ok); background: var(--ok-soft); }
  .badge.refusal { color: var(--warn); background: var(--warn-soft); }
  .answer-text { margin: 0 0 14px; white-space: pre-wrap; }
  h2 { font-size: .8125rem; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 16px 0 6px; }
  ul { margin: 0; padding-left: 20px; }
  a { color: var(--accent); }
  .small { color: var(--muted); font-size: .875rem; margin: 12px 0 0; }
  .error { color: var(--err); }
  details summary { cursor: pointer; font-weight: 600; }
  .hit { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 8px 0; border-top: 1px solid var(--line); font-size: .9375rem; }
  .hit:first-of-type { margin-top: 10px; }
  .hit .id { grid-column: 1 / -1; color: var(--muted); font-size: .8125rem; overflow-wrap: anywhere; }
  .hit .cited { color: var(--ok); font-weight: 600; }
  .bar { grid-column: 1 / -1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Baggage assistant</h1>
  <p class="sub">Questions about Wizz Air baggage. Every answer cites the rule it comes from; if the documents say nothing, it says so.</p>

  <form id="form">
    <input id="q" aria-label="Your question" maxlength="500" placeholder="e.g. Can I take a 12 kg bag into the cabin?" autofocus>
    <button class="ask" id="ask">Ask</button>
  </form>
  <div class="chips" id="chips"></div>

  <div id="out" aria-live="polite"></div>
</main>

<script>
const EXAMPLES = [
  "Can I take a 12 kg bag into the cabin?",
  "What is the limit for the declared value of a checked bag?",
  "Can I take my cat in the cabin?",
  "When does the summer 2027 high season for baggage fees start?",
];
const $ = (id) => document.getElementById(id);

function el(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
}

// Plain text with URLs turned into links, built with the DOM so nothing is parsed as HTML.
function linkify(text) {
  const box = document.createDocumentFragment();
  text.split(/(https?:\/\/\S+)/).forEach((part, i) => {
    box.append(i % 2 ? el("a", { href: part, target: "_blank", rel: "noopener", textContent: part }) : part);
  });
  return box;
}

function render(data) {
  const card = el("div", { className: "card" });
  card.append(el("span", { className: `badge ${data.kind}`, textContent: data.kind === "answer" ? "Answer" : "Not in the sources" }));
  card.append(el("p", { className: "answer-text" }, linkify(data.text)));

  const cited = data.hits.filter((h) => h.cited);
  if (cited.length) {
    card.append(el("h2", { textContent: "Sources" }));
    card.append(el("ul", {}, ...cited.map((h) => el("li", {}, el("a", { href: h.url, target: "_blank", rel: "noopener", textContent: h.title })))));
  }
  if (data.note) card.append(el("p", { className: "small", textContent: data.note }));
  if (data.disclaimer) card.append(el("p", { className: "small", textContent: data.disclaimer }));
  card.append(el("p", { className: "small", textContent: `Answered in ${data.seconds} s` }));

  const top = Math.max(...data.hits.map((h) => h.score));
  const details = el("details", { className: "card" }, el("summary", { textContent: `What the search found (top ${data.hits.length} of ${data.total_chunks} chunks)` }));
  data.hits.forEach((h) => {
    details.append(el("div", { className: "hit" },
      el("span", { textContent: h.title }),
      el("span", { className: h.cited ? "cited" : "", textContent: h.cited ? `cited · ${h.score}` : h.score }),
      el("span", { className: "id", textContent: h.id }),
      el("div", { className: "bar" }, el("span", { style: `width:${(h.score / top) * 100}%` })),
    ));
  });
  $("out").replaceChildren(card, details);
}

async function ask(question) {
  $("ask").disabled = true;
  $("out").replaceChildren(el("p", { className: "small", textContent: "Searching the documents and answering…" }));
  try {
    const res = await fetch("/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    render(data);
  } catch (e) {
    $("out").replaceChildren(el("p", { className: "error", textContent: `Something went wrong: ${e.message}` }));
  } finally {
    $("ask").disabled = false;
  }
}

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const question = $("q").value.trim();
  if (question) ask(question);
});
$("chips").append(...EXAMPLES.map((text) => el("button", { className: "chip", type: "button", textContent: text, onclick: () => { $("q").value = text; ask(text); } })));
</script>
</body>
</html>
